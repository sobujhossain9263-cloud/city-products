<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>City Group — Production Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#181c27;--card:#1e2333;--border:#2a3045;
  --accent:#4f8ef7;--accent2:#a78bfa;--green:#34d399;--red:#f87171;
  --yellow:#fbbf24;--orange:#fb923c;--pink:#f472b6;
  --text:#e8ecf4;--muted:#7b869e;--input:#252c3f;
}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh}

/* LOGIN */
#loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 60% 20%,rgba(79,142,247,0.08),transparent 60%)}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px 32px;width:100%;max-width:380px}
.login-logo{width:56px;height:56px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 18px}
.login-title{font-family:'Space Grotesk',sans-serif;font-size:1.4rem;font-weight:700;text-align:center}
.login-sub{color:var(--muted);font-size:0.8rem;text-align:center;margin:4px 0 28px}
.flabel{font-size:0.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;display:block}
.finput{width:100%;background:var(--input);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:.9rem;padding:11px 13px;outline:none;transition:border-color .15s;margin-bottom:14px}
.finput:focus{border-color:var(--accent)}
.login-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:.95rem;font-weight:700;padding:12px;cursor:pointer;font-family:'Inter',sans-serif;transition:background .2s;margin-top:4px}
.login-btn:hover{background:#3a7de8}
.login-err{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:var(--red);border-radius:7px;padding:9px 13px;font-size:.8rem;margin-top:12px;text-align:center;display:none}

/* APP */
#appPage{display:none}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.hbrand{display:flex;align-items:center;gap:10px}
.hlogo{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
.htitle{font-family:'Space Grotesk',sans-serif;font-size:.95rem;font-weight:700}
.hsub{font-size:.65rem;color:var(--muted)}
.hright{display:flex;align-items:center;gap:8px}
.rbadge{font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.06em}
.rbadge.admin{background:rgba(251,191,36,.15);color:var(--yellow)}
.rbadge.user{background:rgba(79,142,247,.15);color:var(--accent)}
.logout-btn{background:rgba(248,113,113,.1);color:var(--red);border:1px solid rgba(248,113,113,.2);border-radius:6px;padding:5px 12px;font-size:.75rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--surface);padding:0 20px;overflow-x:auto}
.tab-btn{background:none;border:none;color:var(--muted);font-family:'Inter',sans-serif;font-size:.82rem;font-weight:500;padding:11px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s,border-color .15s}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}

/* MAIN */
.main{padding:24px 20px;max-width:900px;margin:0 auto}
.page-title{font-family:'Space Grotesk',sans-serif;font-size:1.4rem;font-weight:700;margin-bottom:4px}
.page-desc{color:var(--muted);font-size:.82rem;margin-bottom:22px}

/* LINE LIST */
.line-list{display:grid;gap:14px;margin-bottom:24px}
.line-btn{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:border-color .2s,background .2s;text-align:left;width:100%}
.line-btn:hover{border-color:var(--accent);background:#212840}
.line-dot{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;font-family:'Space Grotesk',sans-serif;flex-shrink:0}
.dot-jelfy{background:rgba(79,142,247,.15);color:#4f8ef7}
.dot-lollipop{background:rgba(244,114,182,.15);color:#f472b6}
.dot-mold{background:rgba(52,211,153,.15);color:#34d399}
.dot-hard{background:rgba(251,191,36,.15);color:#fbbf24}
.dot-gum{background:rgba(251,146,60,.15);color:#fb923c}
.line-info{flex:1}
.line-name{font-family:'Space Grotesk',sans-serif;font-size:.95rem;font-weight:700}
.line-count{font-size:.72rem;color:var(--muted);margin-top:2px}
.line-arrow{color:var(--muted);font-size:1.1rem}

/* DETAIL VIEW */
#detailView{display:none}
.back-btn{background:none;border:none;color:var(--accent);font-family:'Inter',sans-serif;font-size:.85rem;font-weight:600;cursor:pointer;padding:0;display:flex;align-items:center;gap:6px;margin-bottom:18px}
.detail-header{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.detail-dot{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;font-family:'Space Grotesk',sans-serif}
.detail-title{font-family:'Space Grotesk',sans-serif;font-size:1.3rem;font-weight:700}
.detail-sub{font-size:.75rem;color:var(--muted)}

/* FLAVOR CARDS */
.flavor-card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:14px;overflow:hidden}
.flavor-card-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.flavor-num{font-size:.72rem;color:var(--muted);font-weight:600}
.flavor-name-display{font-family:'Space Grotesk',sans-serif;font-size:.9rem;font-weight:700}
.flavor-body{padding:14px 16px}
.fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field-item{display:flex;flex-direction:column;gap:4px}
.field-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.field-row{display:flex;gap:5px;align-items:center}
.ei{background:var(--input);border:1px solid transparent;border-radius:6px;color:var(--text);font-family:'Inter',sans-serif;font-size:.82rem;padding:6px 8px;outline:none;width:100%;transition:border-color .15s}
.ei:focus{border-color:var(--accent)}
.ei:disabled{background:transparent;cursor:default;padding-left:0}
.ei.num{text-align:right}
.usel{background:var(--input);border:1px solid transparent;border-radius:6px;color:var(--text);font-family:'Inter',sans-serif;font-size:.78rem;padding:6px 4px;outline:none;width:58px;flex-shrink:0}
.usel:disabled{background:transparent;cursor:default}
.del-flavor-btn{background:rgba(248,113,113,.1);color:var(--red);border:none;border-radius:6px;padding:4px 10px;font-size:.72rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.add-flavor-btn{background:none;border:1px dashed var(--border);border-radius:8px;color:var(--muted);cursor:pointer;font-size:.8rem;padding:10px;width:100%;transition:color .15s,border-color .15s;font-family:'Inter',sans-serif;margin-top:4px}
.add-flavor-btn:hover{color:var(--accent);border-color:var(--accent)}

.save-fab{position:fixed;bottom:22px;right:22px;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:12px 22px;font-size:.88rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;box-shadow:0 4px 20px rgba(79,142,247,.4);transition:background .2s}
.save-fab:hover{background:#3a7de8}

/* ADMIN */
.admin-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
.admin-title{font-family:'Space Grotesk',sans-serif;font-size:.92rem;font-weight:700;margin-bottom:12px}
.utable{width:100%;border-collapse:collapse}
.utable th{font-size:.67rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:0 6px 8px;text-align:left;border-bottom:1px solid var(--border)}
.utable td{padding:7px 6px;font-size:.82rem;border-bottom:1px solid var(--border);vertical-align:middle}
.utable tr:last-child td{border-bottom:none}
.ui{background:var(--input);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Inter',sans-serif;font-size:.8rem;padding:6px 8px;outline:none;width:100%}
.ui:focus{border-color:var(--accent)}
.add-user-btn{background:var(--accent);color:#fff;border:none;border-radius:7px;padding:8px 16px;font-size:.8rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;margin-top:10px}
.save-users-btn{background:var(--green);color:#0f1117;border:none;border-radius:7px;padding:8px 16px;font-size:.8rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;margin-top:10px;margin-left:7px}
.del-user{background:rgba(248,113,113,.1);color:var(--red);border:none;border-radius:5px;padding:4px 8px;font-size:.7rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}

.toast{position:fixed;bottom:72px;right:22px;background:var(--green);color:#0f1117;font-weight:700;font-size:.8rem;padding:10px 18px;border-radius:9px;opacity:0;transform:translateY(10px);transition:opacity .3s,transform .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1;transform:translateY(0)}
.hidden{display:none!important}

@media(max-width:480px){.fields-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginPage">
  <div class="login-box">
    <div class="login-logo">🍬</div>
    <div class="login-title">City Group</div>
    <div class="login-sub">Confectionary Division · Production Tracker</div>
    <label class="flabel">User ID</label>
    <input class="finput" id="lid" type="text" placeholder="Enter your ID" autocomplete="off">
    <label class="flabel">Password</label>
    <input class="finput" id="lpw" type="password" placeholder="Enter your password">
    <button class="login-btn" onclick="doLogin()">Login →</button>
    <div class="login-err" id="lerr">Invalid User ID or Password</div>
  </div>
</div>

<!-- APP -->
<div id="appPage">
  <div class="header">
    <div class="hbrand">
      <div class="hlogo">🍬</div>
      <div>
        <div class="htitle">City Group</div>
        <div class="hsub">Production Tracker</div>
      </div>
    </div>
    <div class="hright">
      <span class="rbadge" id="rbadge"></span>
      <button class="logout-btn" onclick="doLogout()">Logout</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabBtnProducts" onclick="showTab('products',this)">📦 Production Lines</button>
    <button class="tab-btn hidden" id="adminTab" onclick="showTab('admin',this)">⚙️ Manage Users</button>
  </div>

  <!-- Products Tab -->
  <div id="tabProducts" class="main">

    <!-- Line List -->
    <div id="lineList">
      <div class="page-title">Production Lines</div>
      <div class="page-desc" id="pdesc"></div>
      <div class="line-list" id="lineListGrid"></div>
    </div>

    <!-- Detail View -->
    <div id="detailView">
      <button class="back-btn" onclick="goBack()">← Back to Lines</button>
      <div class="detail-header">
        <div class="line-dot detail-dot" id="detailDot"></div>
        <div>
          <div class="detail-title" id="detailTitle"></div>
          <div class="detail-sub" id="detailSub"></div>
        </div>
      </div>
      <div id="flavorsContainer"></div>
      <button class="add-flavor-btn hidden" id="addFlavorBtn" onclick="addFlavor()">+ Add Flavor</button>
    </div>

    <button class="save-fab hidden" id="saveFab" onclick="saveAll()">💾 Save</button>
  </div>

  <!-- Admin Tab -->
  <div id="tabAdmin" class="main hidden">
    <div class="page-title">Manage Users</div>
    <div class="page-desc">Add or remove users. Save to apply changes.</div>
    <div class="admin-card">
      <div class="admin-title">👤 Admin Account</div>
      <table class="utable">
        <thead><tr><th>User ID</th><th>Password</th></tr></thead>
        <tbody><tr>
          <td><input class="ui" id="aId" type="text"></td>
          <td><input class="ui" id="aPw" type="text"></td>
        </tr></tbody>
      </table>
    </div>
    <div class="admin-card">
      <div class="admin-title">👥 Users <span style="color:var(--muted);font-size:.7rem;font-weight:400" id="ucnt"></span></div>
      <table class="utable">
        <thead><tr><th>#</th><th>User ID</th><th>Password</th><th></th></tr></thead>
        <tbody id="utbody"></tbody>
      </table>
      <button class="add-user-btn" onclick="addUser()">+ Add User</button>
      <button class="save-users-btn" onclick="saveUsers()">✓ Save All</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const LINES = [
  {id:'jelfy',    name:'Jelfy Line',    dot:'JL', cls:'dot-jelfy'},
  {id:'lollipop', name:'Lollipop Line', dot:'LP', cls:'dot-lollipop'},
  {id:'mold',     name:'Mold Line',     dot:'ML', cls:'dot-mold'},
  {id:'hard',     name:'Hard Candy',    dot:'HC', cls:'dot-hard'},
  {id:'gum',      name:'Gum Line',      dot:'GM', cls:'dot-gum'},
];
const UNITS = ['g','kg','pcs','mm','cm','inch'];
const DEF_ADMIN = {id:'admin',pw:'sobuj7097'};
const DEF_USERS = [{id:'sobuj7097',pw:'sobuj16185'}];
const DEF_ROW = () => ({flavor:'',candyPerBatch:'',candyWt:'',candyWtU:'g',emptyPktWt:'',emptyPktWtU:'g',pktLen:'',pktLenU:'mm',pktWid:'',pktWidU:'mm',batchTotalKg:'',wrapperKg:''});

const LS = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const SS = (k,v) => localStorage.setItem(k,JSON.stringify(v));

let admin = LS('cg_admin') || DEF_ADMIN;
let users = LS('cg_users') || DEF_USERS;
let data  = LS('cg_data2') || {};
let role  = null;
let curLine = null;

LINES.forEach(l => { if(!data[l.id]) data[l.id]=[DEF_ROW()]; });

// LOGIN
function doLogin(){
  const id=document.getElementById('lid').value.trim();
  const pw=document.getElementById('lpw').value;
  admin=LS('cg_admin')||DEF_ADMIN;
  users=LS('cg_users')||DEF_USERS;
  if(id===admin.id&&pw===admin.pw){role='admin';enterApp();}
  else{const u=(users||[]).find(u=>u.id===id&&u.pw===pw);if(u){role='user';enterApp();}else document.getElementById('lerr').style.display='block';}
}
document.getElementById('lid').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('lpw').focus()});
document.getElementById('lpw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});

function enterApp(){
  document.getElementById('loginPage').style.display='none';
  document.getElementById('appPage').style.display='block';
  document.getElementById('lerr').style.display='none';
  document.getElementById('lid').value='';
  document.getElementById('lpw').value='';
  const isAdmin=role==='admin';
  document.getElementById('rbadge').textContent=isAdmin?'Admin':'User';
  document.getElementById('rbadge').className='rbadge '+(isAdmin?'admin':'user');
  document.getElementById('adminTab').classList.toggle('hidden',!isAdmin);
  document.getElementById('saveFab').classList.toggle('hidden',!isAdmin);
  document.getElementById('pdesc').textContent=isAdmin?'Select a production line to view and edit details.':'Select a production line to view details.';
  data=LS('cg_data2')||data;
  renderLineList();
  showTab('products',document.getElementById('tabBtnProducts'));
}
function doLogout(){role=null;document.getElementById('appPage').style.display='none';document.getElementById('loginPage').style.display='flex';document.getElementById('lineList').style.display='block';document.getElementById('detailView').style.display='none';}

// TABS
function showTab(tab,btn){
  document.getElementById('tabProducts').classList.toggle('hidden',tab!=='products');
  document.getElementById('tabAdmin').classList.toggle('hidden',tab!=='admin');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  if(tab==='admin')renderAdmin();
}

// LINE LIST
function renderLineList(){
  const grid=document.getElementById('lineListGrid');
  grid.innerHTML='';
  LINES.forEach(l=>{
    const cnt=data[l.id]?.length||0;
    const btn=document.createElement('button');
    btn.className='line-btn';
    btn.innerHTML=`<div class="line-dot ${l.cls}">${l.dot}</div><div class="line-info"><div class="line-name">${l.name}</div><div class="line-count">${cnt} flavor${cnt!==1?'s':''}</div></div><div class="line-arrow">›</div>`;
    btn.onclick=()=>openLine(l.id);
    grid.appendChild(btn);
  });
}

// OPEN LINE
function openLine(lid){
  curLine=lid;
  const l=LINES.find(x=>x.id===lid);
  document.getElementById('lineList').style.display='none';
  document.getElementById('detailView').style.display='block';
  document.getElementById('detailDot').className=`line-dot detail-dot ${l.cls}`;
  document.getElementById('detailDot').textContent=l.dot;
  document.getElementById('detailTitle').textContent=l.name;
  document.getElementById('addFlavorBtn').classList.toggle('hidden',role!=='admin');
  renderFlavors(lid);
}

function goBack(){
  document.getElementById('detailView').style.display='none';
  document.getElementById('lineList').style.display='block';
  renderLineList();
}

// FLAVORS
function renderFlavors(lid){
  const isAdmin=role==='admin';
  const rows=data[lid]||[];
  document.getElementById('detailSub').textContent=`${rows.length} flavor${rows.length!==1?'s':''}`;
  const container=document.getElementById('flavorsContainer');
  container.innerHTML='';
  rows.forEach((r,i)=>{
    const card=document.createElement('div');
    card.className='flavor-card';
    card.innerHTML=`
      <div class="flavor-card-header">
        <span class="flavor-num">Flavor ${i+1}</span>
        <div style="display:flex;align-items:center;gap:8px">
          <input class="ei" style="width:160px;font-weight:600" data-l="${lid}" data-i="${i}" data-f="flavor" value="${esc(r.flavor)}" placeholder="Flavor name" ${isAdmin?'':'disabled'}>
          ${isAdmin?`<button class="del-flavor-btn" onclick="delFlavor('${lid}',${i})">Remove</button>`:''}
        </div>
      </div>
      <div class="flavor-body">
        <div class="fields-grid">
          <div class="field-item">
            <span class="field-label">Candy per Batch (pcs)</span>
            <input class="ei num" data-l="${lid}" data-i="${i}" data-f="candyPerBatch" type="number" value="${esc(r.candyPerBatch)}" placeholder="0" ${isAdmin?'':'disabled'}>
          </div>
          <div class="field-item">
            <span class="field-label">Candy Weight</span>
            <div class="field-row">
              <input class="ei num" data-l="${lid}" data-i="${i}" data-f="candyWt" type="number" value="${esc(r.candyWt)}" placeholder="0" ${isAdmin?'':'disabled'}>
              <select class="usel" data-l="${lid}" data-i="${i}" data-f="candyWtU" ${isAdmin?'':'disabled'}>${UNITS.map(u=>`<option ${r.candyWtU===u?'selected':''}>${u}</option>`).join('')}</select>
            </div>
          </div>
          <div class="field-item">
            <span class="field-label">Empty Packet Weight</span>
            <div class="field-row">
              <input class="ei num" data-l="${lid}" data-i="${i}" data-f="emptyPktWt" type="number" value="${esc(r.emptyPktWt)}" placeholder="0" ${isAdmin?'':'disabled'}>
              <select class="usel" data-l="${lid}" data-i="${i}" data-f="emptyPktWtU" ${isAdmin?'':'disabled'}>${UNITS.map(u=>`<option ${r.emptyPktWtU===u?'selected':''}>${u}</option>`).join('')}</select>
            </div>
          </div>
          <div class="field-item">
            <span class="field-label">Packet Length</span>
            <div class="field-row">
              <input class="ei num" data-l="${lid}" data-i="${i}" data-f="pktLen" type="number" value="${esc(r.pktLen)}" placeholder="0" ${isAdmin?'':'disabled'}>
              <select class="usel" data-l="${lid}" data-i="${i}" data-f="pktLenU" ${isAdmin?'':'disabled'}>${UNITS.map(u=>`<option ${r.pktLenU===u?'selected':''}>${u}</option>`).join('')}</select>
            </div>
          </div>
          <div class="field-item">
            <span class="field-label">Packet Width</span>
            <div class="field-row">
              <input class="ei num" data-l="${lid}" data-i="${i}" data-f="pktWid" type="number" value="${esc(r.pktWid)}" placeholder="0" ${isAdmin?'':'disabled'}>
              <select class="usel" data-l="${lid}" data-i="${i}" data-f="pktWidU" ${isAdmin?'':'disabled'}>${UNITS.map(u=>`<option ${r.pktWidU===u?'selected':''}>${u}</option>`).join('')}</select>
            </div>
          </div>
          <div class="field-item">
            <span class="field-label">Batch Total Weight (kg)</span>
            <input class="ei num" data-l="${lid}" data-i="${i}" data-f="batchTotalKg" type="number" value="${esc(r.batchTotalKg)}" placeholder="0" ${isAdmin?'':'disabled'}>
          </div>
          <div class="field-item">
            <span class="field-label">Wrapper per Batch (kg)</span>
            <input class="ei num" data-l="${lid}" data-i="${i}" data-f="wrapperKg" type="number" value="${esc(r.wrapperKg)}" placeholder="0" ${isAdmin?'':'disabled'}>
          </div>
        </div>
      </div>`;
    container.appendChild(card);
  });
  // bindings
  container.querySelectorAll('.ei').forEach(el=>el.addEventListener('input',()=>{data[el.dataset.l][+el.dataset.i][el.dataset.f]=el.value;}));
  container.querySelectorAll('.usel').forEach(el=>el.addEventListener('change',()=>{data[el.dataset.l][+el.dataset.i][el.dataset.f]=el.value;}));
}

function addFlavor(){data[curLine].push(DEF_ROW());renderFlavors(curLine);}
function delFlavor(lid,i){if(data[lid].length<=1){data[lid][0]=DEF_ROW();}else data[lid].splice(i,1);renderFlavors(lid);}
function saveAll(){SS('cg_data2',data);showToast('✓ Saved!');}

// ADMIN
function renderAdmin(){
  admin=LS('cg_admin')||DEF_ADMIN;
  users=LS('cg_users')||DEF_USERS;
  document.getElementById('aId').value=admin.id;
  document.getElementById('aPw').value=admin.pw;
  renderUTable();
}
function renderUTable(){
  document.getElementById('ucnt').textContent=`(${users.length}/20)`;
  document.getElementById('utbody').innerHTML=users.map((u,i)=>`
    <tr>
      <td style="color:var(--muted);width:26px">${i+1}</td>
      <td><input class="ui" value="${esc(u.id)}" onchange="users[${i}].id=this.value" placeholder="User ID"></td>
      <td><input class="ui" value="${esc(u.pw)}" onchange="users[${i}].pw=this.value" placeholder="Password"></td>
      <td><button class="del-user" onclick="delUser(${i})">Remove</button></td>
    </tr>`).join('');
}
function addUser(){if(users.length>=20){showToast('Maximum 20 users!');return;}users.push({id:'',pw:''});renderUTable();}
function delUser(i){users.splice(i,1);renderUTable();}
function saveUsers(){
  const newAdmin={id:document.getElementById('aId').value.trim(),pw:document.getElementById('aPw').value};
  if(!newAdmin.id||!newAdmin.pw){showToast('Admin ID/Password cannot be empty!');return;}
  const rows=document.querySelectorAll('#utbody tr');
  users=Array.from(rows).map((_,i)=>{const ins=document.querySelectorAll(`#utbody tr:nth-child(${i+1}) .ui`);return{id:ins[0]?.value.trim()||'',pw:ins[1]?.value||''};}).filter(u=>u.id);
  SS('cg_admin',newAdmin);SS('cg_users',users);admin=newAdmin;
  showToast('✓ Users saved!');renderUTable();
}

function esc(v){return(v||'').toString().replace(/"/g,'&quot;')}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
</script>
</body>
