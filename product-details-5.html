<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>City Group — Production Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--surface:#181c27;--card:#1e2333;--border:#2a3045;--accent:#4f8ef7;--accent2:#a78bfa;--green:#34d399;--red:#f87171;--yellow:#fbbf24;--orange:#fb923c;--text:#e8ecf4;--muted:#7b869e;--input:#252c3f}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh}
#loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px 32px;width:100%;max-width:380px}
.login-logo{width:56px;height:56px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 18px}
.login-title{font-family:'Space Grotesk',sans-serif;font-size:1.4rem;font-weight:700;text-align:center}
.login-sub{color:var(--muted);font-size:.8rem;text-align:center;margin:4px 0 28px}
.flabel{font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;display:block}
.finput{width:100%;background:var(--input);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:.9rem;padding:11px 13px;outline:none;transition:border-color .15s;margin-bottom:14px}
.finput:focus{border-color:var(--accent)}
.login-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:.95rem;font-weight:700;padding:12px;cursor:pointer;font-family:'Inter',sans-serif;margin-top:4px}
.login-err{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:var(--red);border-radius:7px;padding:9px 13px;font-size:.8rem;margin-top:12px;text-align:center;display:none}
#appPage{display:none}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.hbrand{display:flex;align-items:center;gap:10px}
.hlogo{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
.htitle{font-family:'Space Grotesk',sans-serif;font-size:.95rem;font-weight:700}
.hsub{font-size:.65rem;color:var(--muted)}
.hright{display:flex;align-items:center;gap:8px}
.rbadge{font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase}
.rbadge.admin{background:rgba(251,191,36,.15);color:var(--yellow)}
.rbadge.user{background:rgba(79,142,247,.15);color:var(--accent)}
.logout-btn{background:rgba(248,113,113,.1);color:var(--red);border:1px solid rgba(248,113,113,.2);border-radius:6px;padding:5px 12px;font-size:.75rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--surface);padding:0 20px;overflow-x:auto}
.tab-btn{background:none;border:none;color:var(--muted);font-family:'Inter',sans-serif;font-size:.82rem;font-weight:500;padding:11px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s,border-color .15s}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.main{padding:24px 20px;max-width:900px;margin:0 auto}
.page-title{font-family:'Space Grotesk',sans-serif;font-size:1.4rem;font-weight:700;margin-bottom:4px}
.page-desc{color:var(--muted);font-size:.82rem;margin-bottom:22px}
.line-list{display:grid;gap:14px}
.line-btn{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:border-color .2s;text-align:left;width:100%}
.line-btn:hover{border-color:var(--accent);background:#212840}
.line-dot{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;font-family:'Space Grotesk',sans-serif;flex-shrink:0}
.dot-jelfy{background:rgba(79,142,247,.15);color:#4f8ef7}
.dot-lollipop{background:rgba(244,114,182,.15);color:#f472b6}
.dot-mold{background:rgba(52,211,153,.15);color:#34d399}
.dot-hard{background:rgba(251,191,36,.15);color:#fbbf24}
.dot-gum{background:rgba(251,146,60,.15);color:#fb923c}
.line-info{flex:1}
.line-name{font-family:'Space Grotesk',sans-serif;font-size:.95rem;font-weight:700}
.line-count{font-size:.72rem;color:var(--muted);margin-top:2px}
#detailView{display:none}
.back-btn{background:none;border:none;color:var(--accent);font-family:'Inter',sans-serif;font-size:.85rem;font-weight:600;cursor:pointer;padding:0;margin-bottom:18px;display:flex;align-items:center;gap:6px}
.detail-header{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.detail-dot{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;font-family:'Space Grotesk',sans-serif}
.detail-title{font-family:'Space Grotesk',sans-serif;font-size:1.3rem;font-weight:700}
.detail-sub{font-size:.75rem;color:var(--muted)}
.flavor-card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:14px;overflow:hidden}
.fcard-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.fcard-body{padding:14px 16px}
.fnum{font-size:.72rem;color:var(--muted);font-weight:600}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fi{display:flex;flex-direction:column;gap:4px}
.fl{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.frow{display:flex;gap:5px;align-items:center}
.ei{background:var(--input);border:1px solid transparent;border-radius:6px;color:var(--text);font-family:'Inter',sans-serif;font-size:.82rem;padding:6px 8px;outline:none;width:100%;transition:border-color .15s}
.ei:focus{border-color:var(--accent)}
.ei:disabled{background:transparent;cursor:default;padding-left:0}
.usel{background:var(--input);border:1px solid transparent;border-radius:6px;color:var(--text);font-family:'Inter',sans-serif;font-size:.78rem;padding:6px 4px;outline:none;width:58px;flex-shrink:0}
.usel:disabled{background:transparent;cursor:default}
.del-flavor-btn{background:rgba(248,113,113,.1);color:var(--red);border:none;border-radius:6px;padding:4px 10px;font-size:.72rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.add-flavor-btn{background:none;border:1px dashed var(--border);border-radius:8px;color:var(--muted);cursor:pointer;font-size:.8rem;padding:10px;width:100%;font-family:'Inter',sans-serif;margin-top:4px}
.add-flavor-btn:hover{color:var(--accent);border-color:var(--accent)}
.save-fab{position:fixed;bottom:22px;right:22px;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:12px 22px;font-size:.88rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;box-shadow:0 4px 20px rgba(79,142,247,.4)}
.acard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
.atitle{font-family:'Space Grotesk',sans-serif;font-size:.92rem;font-weight:700;margin-bottom:12px}
.utable{width:100%;border-collapse:collapse}
.utable th{font-size:.67rem;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 6px 8px;text-align:left;border-bottom:1px solid var(--border)}
.utable td{padding:7px 6px;font-size:.82rem;border-bottom:1px solid var(--border);vertical-align:middle}
.utable tr:last-child td{border-bottom:none}
.ui{background:var(--input);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Inter',sans-serif;font-size:.8rem;padding:6px 8px;outline:none;width:100%}
.add-user-btn{background:var(--accent);color:#fff;border:none;border-radius:7px;padding:8px 16px;font-size:.8rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;margin-top:10px}
.save-users-btn{background:var(--green);color:#0f1117;border:none;border-radius:7px;padding:8px 16px;font-size:.8rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;margin-top:10px;margin-left:7px}
.del-user{background:rgba(248,113,113,.1);color:var(--red);border:none;border-radius:5px;padding:4px 8px;font-size:.7rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.toast{position:fixed;bottom:72px;right:22px;background:var(--green);color:#0f1117;font-weight:700;font-size:.8rem;padding:10px 18px;border-radius:9px;opacity:0;transform:translateY(10px);transition:opacity .3s,transform .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1;transform:translateY(0)}
.hidden{display:none!important}
@media(max-width:480px){.fgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="loginPage">
  <div class="login-box">
    <div class="login-logo">🍬</div>
    <div class="login-title">City Group</div>
    <div class="login-sub">Confectionary Division · Production Tracker</div>
    <label class="flabel">User ID</label>
    <input class="finput" id="lid" type="text" placeholder="Enter your ID" autocomplete="off">
    <label class="flabel">Password</label>
    <input class="finput" id="lpw" type="password" placeholder="Enter your password" autocomplete="new-password">
    <button class="login-btn" onclick="doLogin()">Login →</button>
    <div class="login-err" id="lerr">Invalid User ID or Password</div>
  </div>
</div>
<div id="appPage">
  <div class="header">
    <div class="hbrand">
      <div class="hlogo">🍬</div>
      <div><div class="htitle">City Group</div><div class="hsub">Production Tracker</div></div>
    </div>
    <div class="hright">
      <span class="rbadge" id="rbadge"></span>
      <button class="logout-btn" onclick="doLogout()">Logout</button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" id="tabBtnP" onclick="showTab('p',this)">📦 Production Lines</button>
    <button class="tab-btn hidden" id="adminTab" onclick="showTab('a',this)">⚙️ Manage Users</button>
  </div>
  <div id="tabP" class="main">
    <div id="lineList">
      <div class="page-title">Production Lines</div>
      <div class="page-desc" id="pdesc"></div>
      <div class="line-list" id="lineListGrid"></div>
    </div>
    <div id="detailView">
      <button class="back-btn" onclick="goBack()">← Back</button>
      <div class="detail-header">
        <div class="line-dot detail-dot" id="detailDot"></div>
        <div><div class="detail-title" id="detailTitle"></div><div class="detail-sub" id="detailSub"></div></div>
      </div>
      <div id="flavorsContainer"></div>
      <button class="add-flavor-btn hidden" id="addFlavorBtn" onclick="addFlavor()">+ Add Flavor</button>
    </div>
    <button class="save-fab hidden" id="saveFab" onclick="saveAll()">💾 Save</button>
  </div>
  <div id="tabA" class="main hidden">
    <div class="page-title">Manage Users</div>
    <div class="page-desc">Add or remove users. Click Save All to apply.</div>
    <div class="acard">
      <div class="atitle">👤 Admin Account</div>
      <table class="utable"><thead><tr><th>User ID</th><th>Password</th></tr></thead>
      <tbody><tr><td><input class="ui" id="aId"></td><td><input class="ui" id="aPw"></td></tr></tbody></table>
    </div>
    <div class="acard">
      <div class="atitle">👥 Users <span style="color:var(--muted);font-size:.7rem;font-weight:400" id="ucnt"></span></div>
      <table class="utable"><thead><tr><th>#</th><th>User ID</th><th>Password</th><th></th></tr></thead>
      <tbody id="utbody"></tbody></table>
      <button class="add-user-btn" onclick="addUser()">+ Add User</button>
      <button class="save-users-btn" onclick="saveUsers()">✓ Save All</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
// HARDCODED DEFAULT ADMIN - always fallback
const DEF_ADMIN_ID = 'admin';
const DEF_ADMIN_PW = 'sobuj7097';

const LINES=[
  {id:'jelfy',name:'Jelfy Line',dot:'JL',cls:'dot-jelfy'},
  {id:'lollipop',name:'Lollipop Line',dot:'LP',cls:'dot-lollipop'},
  {id:'mold',name:'Mold Line',dot:'ML',cls:'dot-mold'},
  {id:'hard',name:'Hard Candy',dot:'HC',cls:'dot-hard'},
  {id:'gum',name:'Gum Line',dot:'GM',cls:'dot-gum'},
];
const UNITS=['g','kg','pcs','mm','cm','inch'];
const DEF=()=>({flavor:'',candyPerBatch:'',candyWt:'',cwU:'g',emptyPktWt:'',epU:'g',pktLen:'',plU:'mm',pktWid:'',pwU:'mm',batchKg:'',wrapKg:''});

const gl=k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}};
const sl=(k,v)=>localStorage.setItem(k,JSON.stringify(v));

function getAdmin(){return gl('cg_adm3')||{id:DEF_ADMIN_ID,pw:DEF_ADMIN_PW}}
function getUsers(){return gl('cg_usr3')||[]}

let data=gl('cg_dt3')||{};
let role=null,curLine=null,_usr=[];
LINES.forEach(l=>{if(!data[l.id])data[l.id]=[DEF()]});

function doLogin(){
  const id=document.getElementById('lid').value.trim();
  const pw=document.getElementById('lpw').value;
  const adm=getAdmin();
  const usr=getUsers();
  document.getElementById('lerr').style.display='none';
  if(id===adm.id&&pw===adm.pw){role='admin';go();}
  else{const u=usr.find(u=>u.id===id&&u.pw===pw);if(u){role='user';go();}else document.getElementById('lerr').style.display='block';}
}
document.getElementById('lid').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('lpw').focus()});
document.getElementById('lpw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});

function go(){
  document.getElementById('loginPage').style.display='none';
  document.getElementById('appPage').style.display='block';
  document.getElementById('lid').value='';
  document.getElementById('lpw').value='';
  const ia=role==='admin';
  document.getElementById('rbadge').textContent=ia?'Admin':'User';
  document.getElementById('rbadge').className='rbadge '+(ia?'admin':'user');
  document.getElementById('adminTab').classList.toggle('hidden',!ia);
  document.getElementById('saveFab').classList.toggle('hidden',!ia);
  document.getElementById('pdesc').textContent=ia?'Select a line to view and edit.':'Select a line to view details.';
  data=gl('cg_dt3')||data;
  renderLL();
  showTab('p',document.getElementById('tabBtnP'));
}

function doLogout(){
  role=null;
  document.getElementById('appPage').style.display='none';
  document.getElementById('loginPage').style.display='flex';
  document.getElementById('lineList').style.display='block';
  document.getElementById('detailView').style.display='none';
}

function showTab(t,btn){
  document.getElementById('tabP').classList.toggle('hidden',t!=='p');
  document.getElementById('tabA').classList.toggle('hidden',t!=='a');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  if(t==='a')renderAdmin();
}

function renderLL(){
  const g=document.getElementById('lineListGrid');
  g.innerHTML='';
  LINES.forEach(l=>{
    const c=(data[l.id]||[]).length;
    const b=document.createElement('button');
    b.className='line-btn';
    b.innerHTML=`<div class="line-dot ${l.cls}">${l.dot}</div><div class="line-info"><div class="line-name">${l.name}</div><div class="line-count">${c} flavor${c!==1?'s':''}</div></div><div style="color:var(--muted);font-size:1.1rem">›</div>`;
    b.onclick=()=>openLine(l.id);
    g.appendChild(b);
  });
}

function openLine(lid){
  curLine=lid;
  const l=LINES.find(x=>x.id===lid);
  document.getElementById('lineList').style.display='none';
  document.getElementById('detailView').style.display='block';
  document.getElementById('detailDot').className=`line-dot detail-dot ${l.cls}`;
  document.getElementById('detailDot').textContent=l.dot;
  document.getElementById('detailTitle').textContent=l.name;
  document.getElementById('addFlavorBtn').classList.toggle('hidden',role!=='admin');
  renderF(lid);
}

function goBack(){
  document.getElementById('detailView').style.display='none';
  document.getElementById('lineList').style.display='block';
  renderLL();
}

function renderF(lid){
  const ia=role==='admin';
  const rows=data[lid]||[];
  document.getElementById('detailSub').textContent=`${rows.length} flavor${rows.length!==1?'s':''}`;
  const c=document.getElementById('flavorsContainer');
  c.innerHTML='';
  rows.forEach((r,i)=>{
    const d=document.createElement('div');
    d.className='flavor-card';
    d.innerHTML=`
      <div class="fcard-head">
        <span class="fnum">Flavor ${i+1}</span>
        <div style="display:flex;align-items:center;gap:8px">
          <input class="ei" style="width:160px;font-weight:600" data-l="${lid}" data-i="${i}" data-f="flavor" value="${e(r.flavor)}" placeholder="Flavor name" ${ia?'':'disabled'}>
          ${ia?`<button class="del-flavor-btn" onclick="delF('${lid}',${i})">Remove</button>`:''}
        </div>
      </div>
      <div class="fcard-body"><div class="fgrid">
        <div class="fi"><span class="fl">Candy per Batch (pcs)</span>
          <input class="ei" type="number" data-l="${lid}" data-i="${i}" data-f="candyPerBatch" value="${e(r.candyPerBatch)}" placeholder="0" ${ia?'':'disabled'}></div>
        <div class="fi"><span class="fl">Candy Weight</span><div class="frow">
          <input class="ei" type="number" data-l="${lid}" data-i="${i}" data-f="candyWt" value="${e(r.candyWt)}" placeholder="0" ${ia?'':'disabled'}>
          <select class="usel" data-l="${lid}" data-i="${i}" data-f="cwU" ${ia?'':'disabled'}>${UNITS.map(u=>`<option ${r.cwU===u?'selected':''}>${u}</option>`).join('')}</select>
        </div></div>
        <div class="fi"><span class="fl">Empty Packet Weight</span><div class="frow">
          <input class="ei" type="number" data-l="${lid}" data-i="${i}" data-f="emptyPktWt" value="${e(r.emptyPktWt)}" placeholder="0" ${ia?'':'disabled'}>
          <select class="usel" data-l="${lid}" data-i="${i}" data-f="epU" ${ia?'':'disabled'}>${UNITS.map(u=>`<option ${r.epU===u?'selected':''}>${u}</option>`).join('')}</select>
        </div></div>
        <div class="fi"><span class="fl">Packet Length</span><div class="frow">
          <input class="ei" type="number" data-l="${lid}" data-i="${i}" data-f="pktLen" value="${e(r.pktLen)}" placeholder="0" ${ia?'':'disabled'}>
          <select class="usel" data-l="${lid}" data-i="${i}" data-f="plU" ${ia?'':'disabled'}>${UNITS.map(u=>`<option ${r.plU===u?'selected':''}>${u}</option>`).join('')}</select>
        </div></div>
        <div class="fi"><span class="fl">Packet Width</span><div class="frow">
          <input class="ei" type="number" data-l="${lid}" data-i="${i}" data-f="pktWid" value="${e(r.pktWid)}" placeholder="0" ${ia?'':'disabled'}>
          <select class="usel" data-l="${lid}" data-i="${i}" data-f="pwU" ${ia?'':'disabled'}>${UNITS.map(u=>`<option ${r.pwU===u?'selected':''}>${u}</option>`).join('')}</select>
        </div></div>
        <div class="fi"><span class="fl">Batch Total Weight (kg)</span>
          <input class="ei" type="number" data-l="${lid}" data-i="${i}" data-f="batchKg" value="${e(r.batchKg)}" placeholder="0" ${ia?'':'disabled'}></div>
        <div class="fi"><span class="fl">Wrapper per Batch (kg)</span>
          <input class="ei" type="number" data-l="${lid}" data-i="${i}" data-f="wrapKg" value="${e(r.wrapKg)}" placeholder="0" ${ia?'':'disabled'}></div>
      </div></div>`;
    c.appendChild(d);
  });
  c.querySelectorAll('.ei').forEach(el=>el.addEventListener('input',()=>{data[el.dataset.l][+el.dataset.i][el.dataset.f]=el.value}));
  c.querySelectorAll('.usel').forEach(el=>el.addEventListener('change',()=>{data[el.dataset.l][+el.dataset.i][el.dataset.f]=el.value}));
}

function addFlavor(){data[curLine].push(DEF());renderF(curLine)}
function delF(lid,i){if(data[lid].length<=1)data[lid][0]=DEF();else data[lid].splice(i,1);renderF(lid)}
function saveAll(){sl('cg_dt3',data);toast('✓ Saved!')}

function renderAdmin(){
  const adm=getAdmin();
  document.getElementById('aId').value=adm.id;
  document.getElementById('aPw').value=adm.pw;
  _usr=[...getUsers()];
  renderUT();
}
function renderUT(){
  document.getElementById('ucnt').textContent=`(${_usr.length}/20)`;
  document.getElementById('utbody').innerHTML=_usr.map((u,i)=>`
    <tr>
      <td style="color:var(--muted);width:26px">${i+1}</td>
      <td><input class="ui" value="${e(u.id)}" oninput="_usr[${i}].id=this.value" placeholder="User ID"></td>
      <td><input class="ui" value="${e(u.pw)}" oninput="_usr[${i}].pw=this.value" placeholder="Password"></td>
      <td><button class="del-user" onclick="delU(${i})">Remove</button></td>
    </tr>`).join('');
}
function addUser(){if(_usr.length>=20){toast('Max 20 users!');return}_usr.push({id:'',pw:''});renderUT()}
function delU(i){_usr.splice(i,1);renderUT()}
function saveUsers(){
  const id=document.getElementById('aId').value.trim();
  const pw=document.getElementById('aPw').value;
  if(!id||!pw){toast('Admin ID/Password cannot be empty!');return}
  sl('cg_adm3',{id,pw});
  sl('cg_usr3',_usr.filter(u=>u.id));
  toast('✓ Users saved!');
}

function e(v){return(v||'').toString().replace(/"/g,'&quot;')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
</script>
